<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>婚礼邀请函 · 席思睿 & 杨若琦</title>
<meta property="og:title" content="婚礼邀请函 · 席思睿 & 杨若琦">
<meta property="og:description" content="2026年10月5日 | 环南礼宴金色大厅">
<meta property="og:image" content="https://alenky00-cmd.github.io/wedding-invite/share_cover.png?v=3">
<meta property="og:type" content="website">
<meta name="description" content="诚邀您参加席思睿 & 杨若琦的婚礼">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
  font-family: 'serif-cn';
  src: local('Songti SC'), local('SimSun'), local('serif');
}

:root {
  --gold: #c79b3c;
  --gold-light: #e0c878;
  --gold-dark: #9a7530;
  --red: #b02a2a;
  --red-deep: #8b1d1d;
  --cream: #faf6f0;
  --ink: #2b2b2b;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: 'Songti SC', 'SimSun', 'Noto Serif SC', serif;
  background: #9E2A22;
  overflow-x: hidden;
  color: var(--ink);
}

/* ===== 花瓣飘落 ===== */
.petal-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}
.petal {
  position: absolute;
  width: 14px; height: 14px;
  opacity: 0.7;
  animation: fall linear infinite;
}
@keyframes fall {
  0%   { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.5; }
  100% { transform: translateY(105vh) translateX(80px) rotate(360deg); opacity: 0; }
}

/* ===== 主容器 ===== */
.invitation {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 36px 0 48px;
  z-index: 10;
}

/* ===== 封面卡片 ===== */
.cover-card {
  position: relative;
  background: linear-gradient(160deg, #faf6f0 0%, #f5ece0 50%, #efe3d2 100%);
  border-radius: 4px;
  padding: 44px 30px 36px;
  margin: 0 18px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  text-align: center;
  overflow: hidden;
  opacity: 0;
  transform: translateY(40px);
  animation: cardIn 1.2s ease forwards 0.3s;
}
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

/* 金色边框装饰 */
.cover-card::before {
  content: '';
  position: absolute;
  top: 10px; left: 10px; right: 10px; bottom: 10px;
  border: 1.5px solid var(--gold);
  border-radius: 2px;
  pointer-events: none;
}
.cover-card::after {
  content: '';
  position: absolute;
  top: 14px; left: 14px; right: 14px; bottom: 14px;
  border: 0.5px solid var(--gold-light);
  border-radius: 2px;
  pointer-events: none;
}

/* 顶部装饰 */
.top-ornament {
  width: 50px; height: 50px;
  margin: 0 auto 16px;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards 1s;
}
.top-ornament svg { width: 100%; height: 100%; }

@keyframes fadeIn { to { opacity: 1; } }

/* 主标题 */
.main-title {
  font-size: 34px;
  color: var(--red);
  letter-spacing: 12px;
  font-weight: bold;
  margin-bottom: 6px;
  text-indent: 12px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.2s;
}

.sub-title-en {
  font-size: 11px;
  color: var(--gold-dark);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.4s;
}

/* 双囍 */
.shuangxi {
  font-size: 52px;
  color: var(--red);
  margin: 8px 0 18px;
  letter-spacing: 4px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.6s;
}

/* 新人姓名 */
.couple-names {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 1.8s;
}
.name-block {
  text-align: center;
}
.name-block .label {
  font-size: 11px;
  color: var(--gold-dark);
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.name-block .name {
  font-size: 30px;
  color: var(--ink);
  font-weight: bold;
  letter-spacing: 4px;
}
.ampersand {
  font-size: 24px;
  color: var(--gold);
  font-style: italic;
}

/* 分隔线 */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px 0;
  gap: 8px;
  opacity: 0;
  animation: fadeIn 0.8s ease forwards 2s;
}
.divider .line {
  width: 50px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.divider .diamond {
  width: 6px; height: 6px;
  background: var(--gold);
  transform: rotate(45deg);
}

/* 婚礼信息 */
.info-section {
  opacity: 0;
  animation: fadeUp 1s ease forwards 2.2s;
}
.info-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}
.info-label {
  font-size: 12px;
  color: var(--gold-dark);
  letter-spacing: 2px;
  white-space: nowrap;
}
.info-value {
  font-size: 15px;
  color: var(--ink);
  letter-spacing: 1px;
}
.info-value.bold {
  font-size: 17px;
  font-weight: bold;
}

/* 日期大字 */
.date-display {
  margin: 18px 0;
  opacity: 0;
  animation: fadeUp 1s ease forwards 2.4s;
}
.date-display .year {
  font-size: 13px;
  color: var(--gold-dark);
  letter-spacing: 3px;
}
.date-display .big-date {
  font-size: 40px;
  color: var(--red);
  font-weight: bold;
  line-height: 1.2;
  margin: 2px 0;
}
.date-display .lunar {
  font-size: 13px;
  color: var(--gold-dark);
  letter-spacing: 2px;
}
.date-display .weekday {
  font-size: 12px;
  color: #999;
  margin-top: 2px;
}

/* 地址 */
.address-section {
  margin-top: 20px;
  opacity: 0;
  animation: fadeUp 1s ease forwards 2.6s;
}
.address-section .venue-name {
  font-size: 18px;
  color: var(--ink);
  font-weight: bold;
  margin-bottom: 6px;
}
.address-section .venue-addr {
  font-size: 13px;
  color: #777;
  line-height: 1.6;
  padding: 0 8px;
}

/* 导航按钮 */
.nav-btn {
  display: inline-block;
  margin-top: 16px;
  padding: 8px 28px;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: #fff;
  font-size: 13px;
  letter-spacing: 3px;
  border-radius: 30px;
  text-decoration: none;
  box-shadow: 0 3px 12px rgba(176,42,42,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}
.nav-btn:active {
  transform: scale(0.95);
  box-shadow: 0 2px 8px rgba(176,42,42,0.3);
}

/* 邀请语 */
.invite-text {
  margin-top: 24px;
  font-size: 13px;
  color: #888;
  line-height: 1.8;
  letter-spacing: 1px;
  opacity: 0;
  animation: fadeIn 1s ease forwards 2.8s;
}

/* 底部装饰 */
.bottom-ornament {
  margin-top: 20px;
  opacity: 0;
  animation: fadeIn 1s ease forwards 3s;
}
.bottom-ornament svg {
  width: 120px;
  height: 24px;
}

/* ===== 底部提示 ===== */
.footer-tip {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  opacity: 0;
  animation: fadeIn 1s ease forwards 3.2s;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 音乐按钮 ===== */
.music-btn {
  position: fixed;
  top: 16px; right: 16px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 200;
  transition: background 0.3s;
}
.music-btn:active { background: rgba(255,255,255,0.25); }
.music-btn svg {
  width: 18px; height: 18px;
  fill: rgba(255,255,255,0.8);
}
.music-btn.playing svg {
  animation: spin 3s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 倒计时 ===== */
.countdown-section {
  margin-top: 20px;
  text-align: center;
  opacity: 0;
  animation: fadeUp 1s ease forwards 2.8s;
}
.countdown-label {
  font-size: 12px;
  color: var(--gold-dark);
  letter-spacing: 3px;
  margin-bottom: 10px;
}
.countdown-boxes {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 6px;
}
.cd-box {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.cd-num {
  width: 48px;
  height: 48px;
  line-height: 48px;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  border-radius: 6px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(176,42,42,0.3);
}
.cd-unit {
  font-size: 11px;
  color: var(--gold-dark);
  margin-top: 4px;
  letter-spacing: 2px;
}
.cd-colon {
  font-size: 22px;
  color: var(--gold);
  font-weight: bold;
  line-height: 42px;
}

/* ===== 弹幕区 ===== */
.danmu-section {
  margin-top: 24px;
  padding: 0 8px;
  text-align: center;
  opacity: 0;
  animation: fadeUp 1s ease forwards 3.0s;
}
.danmu-label {
  font-size: 12px;
  color: var(--gold-dark);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.danmu-display {
  position: relative;
  height: 80px;
  overflow: hidden;
  border: 1px solid var(--gold-light);
  border-radius: 8px;
  background: rgba(255,255,255,0.3);
  margin-bottom: 10px;
}
.danmu-item {
  position: absolute;
  white-space: nowrap;
  font-size: 13px;
  color: var(--gold-dark);
  background: rgba(255,255,255,0.85);
  padding: 3px 10px;
  border-radius: 14px;
  animation: danmuMove linear forwards;
  pointer-events: none;
}
@keyframes danmuMove {
  from { transform: translateX(100%); }
  to { transform: translateX(-120%); }
}
.danmu-input-area {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.danmu-input-area input {
  padding: 6px 10px;
  border: 1px solid var(--gold);
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  background: rgba(255,255,255,0.6);
  color: var(--ink);
  outline: none;
  width: 80px;
}
.danmu-input-area input:focus {
  border-color: var(--red);
}
.danmu-input-area input[name="msg"] {
  width: 140px;
}
.danmu-btn {
  padding: 6px 16px;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: inherit;
}
.danmu-btn:active {
  transform: scale(0.95);
}

/* ===== 祝福弹窗 ===== */
.bless-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.78);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.bless-modal.show {
  opacity: 1;
}
.bless-content {
  background: linear-gradient(160deg, #faf6f0 0%, #f5ece0 50%, #efe3d2 100%);
  border-radius: 10px;
  padding: 28px 20px 24px;
  margin: 0 16px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  box-shadow: 0 12px 48px rgba(0,0,0,0.4);
  position: relative;
}
.bless-title {
  font-size: 22px;
  color: var(--red);
  letter-spacing: 8px;
  margin-bottom: 6px;
  font-weight: bold;
}
.bless-sub {
  font-size: 13px;
  color: var(--gold-dark);
  margin-bottom: 14px;
}
.bless-btn {
  display: inline-block;
  padding: 12px 40px;
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  color: #fff;
  border: none;
  border-radius: 24px;
  font-size: 16px;
  letter-spacing: 6px;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
}
.bless-btn:active {
  transform: scale(0.95);
}

/* ===== 全屏弹幕层 ===== */
.bless-danmu-fullscreen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.bless-danmu-fullscreen.show {
  opacity: 1;
}
.bless-danmu-fullscreen.hide {
  opacity: 0;
}
@keyframes danmuSlide {
  from { transform: translateX(0); }
  to   { transform: translateX(calc(-100vw - 100%)); }
}
.bless-danmu {
  position: absolute;
  white-space: nowrap;
  font-size: 14px;
  padding: 5px 14px;
  border-radius: 18px;
  pointer-events: none;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  animation: danmuSlide linear forwards;
  will-change: transform;
}


/* ===== 撒花特效 ===== */
.confetti-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 300;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  opacity: 0.8;
}
@keyframes confetti-fall {
  0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
}

/* ===== 响应式微调 ===== */
@media (max-width: 360px) {
  .main-title { font-size: 28px; letter-spacing: 8px; }
  .shuangxi { font-size: 44px; }
  .name-block .name { font-size: 26px; }
  .date-display .big-date { font-size: 34px; }
  .cover-card { padding: 36px 22px 30px; }
}
</style>
</head>
<body>

    <!-- 撒花特效层 -->
    <div class="confetti-layer" id="confettiLayer"></div>
  <div class="bless-danmu-fullscreen" id="blessDanmuFull"></div>
<div class="bless-modal" id="blessModal">
  <div class="bless-content">

<!-- 音乐按钮 -->

<div class="invitation">

<script>
// ===== 花瓣飘落 =====
(function() {
  var layer = document.getElementById('petalLayer');
  var petalSVG = '<svg viewBox="0 0 14 14"><path d="M7 0 C10 2 12 5 7 14 C2 5 4 2 7 0" fill="#e8b4b8" opacity="0.8"/></svg>';
  var count = 15;
  for (var i = 0; i < count; i++) {
    var p = document.createElement('div');
    p.className = 'petal';
    p.innerHTML = petalSVG;
    p.style.left = Math.random() * 100 + '%';
    var dur = 6 + Math.random() * 6;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = Math.random() * dur + 's';
    var scale = 0.6 + Math.random() * 0.8;
    p.style.transform = 'scale(' + scale + ')';
    p.style.opacity = 0.3 + Math.random() * 0.4;
    layer.appendChild(p);
  }
})();

// ===== 倒计时 =====
(function() {
  var targetDate = new Date('2026-10-05T00:00:00');
  var cdDays = document.getElementById('cdDays');
  var cdHours = document.getElementById('cdHours');
  var cdMins = document.getElementById('cdMins');
  var cdSecs = document.getElementById('cdSecs');

  function updateCountdown() {
    var now = new Date();
    var diff = targetDate - now;
    if (diff <= 0) {
      cdDays.textContent = '00';
      cdHours.textContent = '00';
      cdMins.textContent = '00';
      cdSecs.textContent = '00';
      return;
    }
    var days = Math.floor(diff / (1000 * 60 * 60 * 24));

function initAudio() {
  if (audio) return;
  var mp3Data = mp3Parts.join("");
  var binary = atob(mp3Data);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  var blob = new Blob([bytes], {type: 'audio/mpeg'});
  var url = URL.createObjectURL(blob);
  audio = new Audio(url);
  audio.loop = true;
}

function toggleMusic() {
  var btn = document.getElementById('musicBtn');
  if (!audio) initAudio();
  if (!isPlaying) {
    audio.play().then(function() {
      isPlaying = true;
      btn.classList.add('playing');
    }).catch(function(e) {
      console.log('Audio play blocked');
    });
  } else {
    audio.pause();
    isPlaying = false;
    btn.classList.remove('playing');
  }
}

  "愿你们携手百年，幸福安康"

var blessModal = document.getElementById('blessModal');
var blessDanmuFull = document.getElementById('blessDanmuFull');
var blessIndex = 0;
var blessInterval = null;
var blessModalShown = false;

function initBlessModal() {
  // Show modal on first visit
  blessModal.style.display = 'flex';
  setTimeout(function() {
    blessModal.classList.add('show');
  }, 100);
}

function showBlessMessage() {
  var msgs = blessMessages;
  var area = blessDanmuFull;
  var danmuIndex = 0;
  
  // Show fullscreen layer
  area.classList.add('show');
  
  // Random pick from messages
  function pickRandom() {
    return msgs[Math.floor(Math.random() * msgs.length)];
  }
  
  function addDanmu() {
    if (danmuIndex >= 99) {
      return;
    }
    
    var text = pickRandom();
    var el = document.createElement('div');
    el.className = 'bless-danmu';
    el.textContent = text;
    
    // 24 fixed tracks evenly spaced across full screen
    var track = Math.floor(Math.random() * 24);
    var topPercent = 3 + track * 3.8 + (Math.random() - 0.5) * 2;
    if (topPercent < 1) topPercent = 1;
    if (topPercent > 96) topPercent = 96;
    el.style.top = topPercent + '%';
    el.style.left = '100%';
    
    // Small font 11-15px for more density
    var fontSize = 11 + Math.floor(Math.random() * 5);
    el.style.fontSize = fontSize + 'px';
    
    // Fast duration 2-5s to clear quickly
    var duration = 2 + Math.random() * 3;
    el.style.animationDuration = duration + 's';
    
    // Random colors
    var bgColors = [
      'rgba(158,42,34,0.75)',
      'rgba(184,134,11,0.75)',
      'rgba(212,98,106,0.75)',
      'rgba(75,54,33,0.75)',
      'rgba(200,150,100,0.75)',
      'rgba(139,69,19,0.75)',
      'rgba(139,0,0,0.75)',
      'rgba(178,34,34,0.75)'
    ];
    el.style.background = bgColors[Math.floor(Math.random() * bgColors.length)];
    el.style.color = '#fff';
    
    area.appendChild(el);
    
    // Remove after animation completes
    setTimeout(function(e) {
      if (e.parentNode) e.parentNode.removeChild(e);
    }, duration * 1000 + 50, el);
    
    danmuIndex++;
  }
  
  // Launch 99 danmu in 10 seconds: ~101ms interval
  // First batch: 10 immediately to fill screen
  for (var i = 0; i < 10; i++) {
    setTimeout(addDanmu, i * 80);
  }
  
  // Then continue at ~100ms interval for remaining 89
  var count = 10;
  var timer = setInterval(function() {
    addDanmu();
    count++;
    if (count >= 99) {
      clearInterval(timer);
      // Auto-hide layer 6s after last danmu launched
      setTimeout(function() {
        area.classList.remove('show');
        area.classList.add('hide');
        setTimeout(function() {
          area.classList.remove('hide');
          area.innerHTML = '';
        }, 1000);
      }, 6000);
    }
  }, 100);
}

function openBlessAndPlay() {
  // Close modal first
  closeBlessModal();
  
  // Start scrolling blessings (fullscreen danmu)
  showBlessMessage();
  
  // Launch confetti effect
  launchConfetti();
  
  // Start music
  var btn = document.getElementById('musicBtn');
  if (!audio) initAudio();
  audio.muted = false;
  audio.play().then(function() {
    isPlaying = true;
    btn.classList.add('playing');
  }).catch(function(e) {
    console.log('Play blocked');
  });
}

// ===== 撒花特效 =====
function launchConfetti() {
  var layer = document.getElementById('confettiLayer');
  if (!layer) return;
  
  var colors = ['#e8b4b8', '#f5d0c5', '#f8e1d4', '#ffd700', '#ff6b6b', '#fff5e6'];
  var shapes = ['circle', 'rect', 'heart'];
  var count = 60;
  
  for (var i = 0; i < count; i++) {
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    
    var shape = shapes[Math.floor(Math.random() * shapes.length)];
    var color = colors[Math.floor(Math.random() * colors.length)];
    var size = 6 + Math.random() * 10;
    var left = Math.random() * 100;
    var delay = Math.random() * 2;
    var duration = 2 + Math.random() * 3;
    var rotation = Math.random() * 360;
    
    piece.style.left = left + '%';
    piece.style.top = '-20px';
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.background = color;
    piece.style.borderRadius = shape === 'circle' ? '50%' : (shape === 'heart' ? '0 50% 50% 0' : '2px');
    piece.style.animation = 'confetti-fall ' + duration + 's ease-out ' + delay + 's forwards';
    piece.style.transform = 'rotate(' + rotation + 'deg)';
    
    // Heart shape using clip-path
    if (shape === 'heart') {
      piece.style.clipPath = 'polygon(50% 0%, 100% 35%, 100% 70%, 50% 100%, 0% 70%, 0% 35%)';
      piece.style.borderRadius = '0';
    }
    
    layer.appendChild(piece);
    
    // Remove after animation
    setTimeout(function(p) {
      return function() {
        if (p.parentNode) p.parentNode.removeChild(p);
      };
    }(piece), (duration + delay) * 1000);
  }
  
  // Second wave after 0.5s
  setTimeout(function() {
    for (var j = 0; j < 30; j++) {
      var piece2 = document.createElement('div');
      piece2.className = 'confetti-piece';
      var color2 = colors[Math.floor(Math.random() * colors.length)];
      var size2 = 4 + Math.random() * 8;
      var left2 = Math.random() * 100;
      var duration2 = 2 + Math.random() * 3;
      
      piece2.style.left = left2 + '%';
      piece2.style.top = '-20px';
      piece2.style.width = size2 + 'px';
      piece2.style.height = size2 + 'px';
      piece2.style.background = color2;
      piece2.style.borderRadius = '50%';
      piece2.style.animation = 'confetti-fall ' + duration2 + 's ease-out forwards';
      
      layer.appendChild(piece2);
      setTimeout(function(p) {
        return function() {
          if (p.parentNode) p.parentNode.removeChild(p);
        };
      }(piece2), duration2 * 1000);
    }
  }, 500);
}

function closeBlessModal() {
  blessModal.classList.remove('show');
  setTimeout(function() {
    blessModal.style.display = 'none';
    if (blessInterval) {
      clearInterval(blessInterval);
      blessInterval = null;
    }
  }, 500);
}

// Show bless modal on page load
window.addEventListener('load', function() {
  setTimeout(initBlessModal, 1000);
});

// Close modal when clicking outside
blessModal.addEventListener('click', function(e) {
  if (e.target === blessModal) {
    closeBlessModal();
  }
});

// ===== 自动播放策略 =====
function tryAutoPlay() {
  initAudio();
  var btn = document.getElementById('musicBtn');
  
  // 尝试静音自动播放（更容易通过浏览器限制）
  audio.muted = true;
  audio.play().then(function() {
    // 播放成功后再取消静音
    audio.muted = false;
    isPlaying = true;
    btn.classList.add('playing');
    console.log('Auto-play success');
  }).catch(function(e) {
    console.log('Auto-play blocked, waiting for interaction');
    // 失败时保持静音状态，等待用户交互
  });
}

// 页面加载后立即尝试
window.addEventListener('load', tryAutoPlay);

// 多事件监听确保播放
['click', 'touchstart', 'scroll', 'mousemove'].forEach(function(evt) {
  document.addEventListener(evt, function handler() {
    if (!isPlaying && audio) {
      audio.muted = false;
      audio.play().then(function() {
        isPlaying = true;
        btn.classList.add('playing');
        console.log('Play triggered by ' + evt);
      });
    }
  }, {once: true});
});
</script>
